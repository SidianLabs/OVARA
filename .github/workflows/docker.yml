name: Docker Builds

on:
  push:
    branches: [main, "phase-7-foundations"]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Gateway Image
        # Dockerfile expects the repo root as context (COPY identity/ +
        # runtime/gateway/) — passing the subdir breaks the build.
        run: docker build -f runtime/gateway/Dockerfile -t ovara/gateway:latest .
      - name: Build Control Plane
        run: docker build -t ovara/control-plane:latest cloud/control-plane

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
