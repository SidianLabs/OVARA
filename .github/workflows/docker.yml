name: Docker Builds

on:
  push:
    branches: [main, "phase-7-foundations"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull Docker Hub images through mirror.gcr.io (Docker Hub rate-limits shared runners)
        run: bash .github/scripts/docker-hub-mirror.sh
      - name: Build Gateway Image
        run: docker build -f runtime/gateway/Dockerfile -t ovara/gateway:latest .
      - name: Build ovara (gateway + proxy) image
        # Build context is the repo root: the binary embeds the gateway module.
        run: docker build -f proxy/Dockerfile -t ovara/ovara:latest .

  # The box image as the release builds it (release.yml box-image), both
  # architectures, without pushing: a broken image fails here, not on the tag.
  box-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull Docker Hub images through mirror.gcr.io (Docker Hub rate-limits shared runners)
        run: bash .github/scripts/docker-hub-mirror.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: box
          platforms: linux/amd64,linux/arm64
          push: false

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        # Pinned by commit: this action's tags have been rewritten upstream
        # before (the old 0.28.0 tag no longer exists at all).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
