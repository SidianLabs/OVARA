name: Docker Builds

on:
  push:
    branches: [main, "phase-7-foundations"]
    tags: ["v*"]
  pull_request:

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Gateway Image
        run: docker build -f runtime/gateway/Dockerfile -t ovara/gateway:latest .
      - name: Build ovara (gateway + proxy) image
        # Build context is the repo root: the binary embeds the gateway module.
        run: docker build -f proxy/Dockerfile -t ovara/ovara:latest .
      - name: Build Control Plane
        run: docker build -t ovara/control-plane:latest cloud/control-plane

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
