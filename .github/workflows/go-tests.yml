name: Go Tests

on:
  push:
    branches: [main, "phase-*"]
    paths:
      - "runtime/**"
      - "identity/**"
      - "trust/**"
      - "services/**"
      - "tools/**"
      - "telemetry/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - runtime/gateway
          - identity
          - trust
          - services/approval
          - services/receipt-storage
          - tools/cli
          - telemetry/collector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

      - name: Bench
        working-directory: ${{ matrix.module }}
        run: go test -bench=. -benchtime=1s ./... 2>/dev/null || true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: E2E Tests
        working-directory: runtime/gateway
        run: go test -v -run TestE2E ./cmd/e2e/
