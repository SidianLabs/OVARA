name: Go Tests

on:
  push:
    branches: [main, "phase-*"]
    paths:
      - "runtime/**"
      - "proxy/**"
      - "tools/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - runtime/gateway
          - proxy
          - tools/cli
          - tools/migration
          - tools/benchmarks
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true   # the newest patch, not the runner's cached one (stdlib fixes)

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

      - name: Bench
        working-directory: ${{ matrix.module }}
        run: go test -bench=. -benchtime=1s ./... 2>/dev/null || true

  # The tier 1 box tests need root (namespaces, mounts, a second user); in
  # the matrix above they run as the runner's user and skip. The test binary
  # is built as that user and only run as root, so no root-owned files land
  # in the Go caches.
  box-tier1-root:
    name: box tier 1 (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true   # the newest patch, not the runner's cached one (stdlib fixes)
      # Built as the runner's user, run as root: no root-owned files in the Go caches.
      - name: Build the test binaries and ovara
        working-directory: proxy
        run: |
          go test -c -o "$RUNNER_TEMP/ovara-cmd.test" ./cmd/ovara
          go test -c -o "$RUNNER_TEMP/ovara-vm.test" ./internal/vm
          go build -o "$RUNNER_TEMP/ovara" ./cmd/ovara
      - name: nftables (the VM guest's lockdown)
        run: command -v nft >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q nftables; }
      # Tier 1, the VM guest side, and `ovara box -vm` end to end with a
      # network namespace standing in for the VM (box.md §10.1).
      - name: Tier 1 and VM tests as root
        working-directory: proxy/cmd/ovara
        run: sudo -E env "PATH=$PATH" OVARA_TEST_BINARY="$RUNNER_TEMP/ovara" OVARA_REQUIRE_VM_E2E=1 "$RUNNER_TEMP/ovara-cmd.test" -test.run 'Tier1|Box|VMGuest|WriteTree' -test.count=1 -test.v
      # The VM guest's network lockdown, checked for real: a network
      # namespace stands in for the guest and runs the provisioning script.
      - name: VM guest lockdown as root
        working-directory: proxy/internal/vm
        run: sudo -E env "PATH=$PATH" OVARA_REQUIRE_LOCKDOWN_TEST=1 "$RUNNER_TEMP/ovara-vm.test" -test.run 'Lockdown' -test.count=1 -test.v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true   # the newest patch, not the runner's cached one (stdlib fixes)
      - name: E2E Tests
        working-directory: runtime/gateway
        run: go test -v -run TestE2E ./cmd/e2e/
      # 100k receipts: rotation into compressed segments, end-to-end
      # verification, doctor's size warning (too slow under -race)
      - name: Receipt retention at 100k receipts
        working-directory: proxy
        run: OVARA_LONG_TESTS=1 go test -count=1 -run TestReceipts_100kRotateCompressWarn ./cmd/ovara
      # every `ovara` command line in the quickstart names a real command and real flags
      - name: Docs name real commands
        run: bash tests/docs/check-commands.sh

  # The `ovara` binary is what users actually run, on their own laptops.
  # Prove it builds and its tests (including the end-to-end demo) pass on
  # Windows and macOS, not only Linux. The gateway it embeds runs its own
  # suite on Windows too (file locking, journals, executors).
  proxy-cross-platform:
    name: ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        module: [proxy, runtime/gateway]
        exclude:
          - os: macos-latest
            module: runtime/gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true   # the newest patch, not the runner's cached one (stdlib fixes)
      # The gateway's shell executor runs `sh -c`; Git for Windows ships sh.
      - name: Put Git sh on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:ProgramFiles\Git\bin"
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        working-directory: sdk/python
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: sdk/python
        run: python -m pytest -q
      # A second, independent implementation of the C1/C2 contracts must
      # agree with the conformance vectors (which the Go reference generates
      # and is drift-tested against). Stdlib only.
      - name: Conformance (second implementation)
        run: python3 -I conformance/impl-python/conformance_check.py
