name: Go Tests

on:
  push:
    branches: [main, "phase-*"]
    paths:
      - "runtime/**"
      - "proxy/**"
      - "services/**"
      - "tools/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - runtime/gateway
          - proxy
          - services/approval
          - services/alerting
          - services/observability
          - services/receipt-storage
          - tools/cli
          - tools/migration
          - tools/benchmarks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

      - name: Bench
        working-directory: ${{ matrix.module }}
        run: go test -bench=. -benchtime=1s ./... 2>/dev/null || true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: E2E Tests
        working-directory: runtime/gateway
        run: go test -v -run TestE2E ./cmd/e2e/

  # The `ovara` binary is what users actually run, on their own laptops.
  # Prove it builds and its tests (including the end-to-end demo) pass on
  # Windows and macOS, not only Linux.
  proxy-cross-platform:
    name: proxy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        working-directory: proxy
        run: go build ./...
      - name: Test
        working-directory: proxy
        run: go test -count=1 ./...

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: sdk/python
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: sdk/python
        run: python -m pytest -q
