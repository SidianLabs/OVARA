name: Vulnerability scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [proxy, runtime/gateway]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true   # the newest patch, not the runner's cached one (stdlib fixes)
      # Reports only vulnerabilities in code the module actually calls.
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (runtime dependencies)
        working-directory: sdk/typescript
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        working-directory: sdk/python
        run: |
          pip install pip-audit .
          pip-audit
