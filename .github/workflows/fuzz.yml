name: Fuzz

# Parsers and matchers that read agent- or disk-controlled input are fuzzed
# on a schedule. Crashing inputs are uploaded; commit them under
# testdata/fuzz/ so they run as ordinary regression tests from then on.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with FUZZ_TARGETS in the Makefile. Every target's
        # seed corpus (and testdata/fuzz/) also runs in the Go Tests workflow.
        include:
          - { module: proxy,           pkg: ./internal/proxy,           target: FuzzParseRefUpdates }
          - { module: proxy,           pkg: ./internal/proxy,           target: FuzzParseRefUpdatesRoundTrip }
          - { module: proxy,           pkg: ./internal/proxy,           target: FuzzValidUploadPackRequest }
          - { module: proxy,           pkg: ./internal/proxy,           target: FuzzNormalizeHost }
          - { module: proxy,           pkg: ./internal/proxy,           target: FuzzReadCarriesData }
          - { module: proxy,           pkg: ./internal/proxy,           target: FuzzModelValueRefusal }
          - { module: proxy,           pkg: ./internal/proxy,           target: FuzzRedactPreviewCount }
          - { module: proxy,           pkg: ./internal/canonjson,       target: FuzzCanonical }
          - { module: proxy,           pkg: ./cmd/ovara,                target: FuzzTermSafe }
          - { module: proxy,           pkg: ./cmd/ovara,                target: FuzzParseGitHubRemote }
          - { module: proxy,           pkg: ./internal/boxgate,         target: FuzzPolicyLine }
          - { module: proxy,           pkg: ./internal/creds,           target: FuzzScopeToRepo }
          - { module: proxy,           pkg: ./internal/receipts,        target: FuzzReceiptLine }
          - { module: runtime/gateway, pkg: ./internal/policy,          target: FuzzMatchCanonicalResource }
          - { module: runtime/gateway, pkg: ./internal/policy,          target: FuzzCanonicalResource }
          - { module: runtime/gateway, pkg: ./internal/policy,          target: FuzzMatchResource }
          - { module: runtime/gateway, pkg: ./internal/policy,          target: FuzzSplitRefList }
          - { module: runtime/gateway, pkg: ./internal/evaluator,       target: FuzzPrecedence }
          - { module: runtime/gateway, pkg: ./internal/record,          target: FuzzOpenNeverPanics }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true   # the newest patch, not the runner's cached one (stdlib fixes)
      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.module }}
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=3m ${{ matrix.pkg }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.module }}/**/testdata/fuzz/${{ matrix.target }}/*
