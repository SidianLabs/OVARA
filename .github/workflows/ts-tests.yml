name: TypeScript Tests

on:
  push:
    branches: [main, "phase-*"]
    paths:
      - "sdk/**"
      - "integrations/**"
      - "policy/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - sdk/typescript
          - integrations/mcp
          - integrations/openai
          - policy/compiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.module }}/package-lock.json

      # Modules that declare @ovara/sdk via file:../../sdk/typescript get a
      # symlink, not a build — the SDK's dist/ must exist before typecheck.
      # npm ci in sdk/typescript runs `prepare` which builds dist.
      - name: Build local @ovara/sdk
        if: matrix.module == 'integrations/mcp' || matrix.module == 'integrations/openai'
        working-directory: sdk/typescript
        run: npm ci

      - name: Install
        working-directory: ${{ matrix.module }}
        run: npm ci

      - name: TypeCheck
        working-directory: ${{ matrix.module }}
        run: npx tsc --noEmit

      - name: Test
        working-directory: ${{ matrix.module }}
        run: npx vitest run

