name: Lint

on:
  push:
    branches: [main, "phase-*"]
    paths:
      - "runtime/**"
      - "identity/**"
      - "trust/**"
      - "services/**"
      - "tools/**"
      - "telemetry/**"
      - ".golangci.yml"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main]

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - runtime/gateway
          - identity
          - trust
          - services/approval
          - services/alerting
          - services/observability
          - services/receipt-storage
          - tools/cli
          - tools/migration
          - tools/benchmarks
          - telemetry/collector
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # The action runs the linter itself in its own working-directory
      # (repo root by default) — pass the matrix module or it scans the
      # root, which has no go.mod and fails with exit code 7.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  tslint:
    name: ESLint (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: cloud/control-plane
        run: npm ci

      - name: Lint
        working-directory: cloud/control-plane
        run: npm run lint || true
