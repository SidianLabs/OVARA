name: Lint

on:
  push:
    branches: [main, "phase-*"]
    paths:
      - "runtime/**"
      - "proxy/**"
      - "tools/**"
      - ".golangci.yml"
      - ".github/workflows/lint.yml"
  pull_request:

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - runtime/gateway
          - proxy
          - tools/cli
          - tools/migration
          - tools/benchmarks
    steps:
      - uses: actions/checkout@v7
        with:
          # --new-from-rev below needs the PR's base commit in the clone.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true   # the newest patch, not the runner's cached one (stdlib fixes)

      # The commit the linter compares against: the PR's base, or the
      # commit before the push. golangci-lint finds the new issues itself
      # (--new-from-rev). The action's own only-new-issues fetches the diff
      # from the API instead, which GitHub refuses for a change touching
      # more than 300 files; the action then lints the whole module and
      # fails on the old debt. A push that creates a branch has no "before"
      # commit and falls back to the action's diff.
      - name: Find the commit to compare against
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "rev=" >> "$GITHUB_OUTPUT"
          else
            echo "rev=$base" >> "$GITHUB_OUTPUT"
          fi

      # The action runs the linter itself in its own working-directory
      # (repo root by default) — pass the matrix module or it scans the
      # root, which has no go.mod and fails with exit code 7.
      # Prebuilt v1.x binaries are compiled with an older Go and refuse
      # modules targeting go1.25+ ("language version lower than targeted").
      # goinstall builds the linter with the runner's Go so the check passes.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64
          install-mode: goinstall
          working-directory: ${{ matrix.module }}
          # The lint gate never ran before (broken job config), so the
          # repo carries preexisting lint debt. Gate only what the change
          # introduces; whole-repo cleanup can come as its own change.
          only-new-issues: ${{ steps.base.outputs.rev == '' }}
          # `config verify` downloads the config schema from golangci-lint.run
          # on every run; twice that download timed out and failed the job
          # before any linting. The config is checked when it is loaded anyway.
          verify: false
          args: --timeout=5m ${{ steps.base.outputs.rev != '' && format('--new-from-rev={0}', steps.base.outputs.rev) || '' }}
