name: User scenarios

# Real tools (pip, npm, git, Node fetch, curl) through the real binary, with a
# human approving and denying. Needs outbound internet, so it is separate from
# the unit suites and does not gate every push.

on:
  pull_request:
    paths:
      - "proxy/**"
      - "runtime/gateway/**"
      - "tests/scenarios/**"
      - ".github/workflows/scenarios.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run user scenarios
        run: tests/scenarios/run.sh
