<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ovara approvals</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --allow: #1f7a4d; --allow-bg: #e6f3ec; --deny: #b42318; --deny-bg: #fbe9e7;
    --wait: #8a5a00; --wait-bg: #fdf3dc; --accent: #2b59c3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ecebe6; --muted: #a09f99; --line: #33332f;
      --allow: #5cc493; --allow-bg: #173327; --deny: #f08a7e; --deny-bg: #3a1d19;
      --wait: #f0c060; --wait-bg: #3a2e12; --accent: #8fb0ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 32px 0 10px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .04em; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 10px; }
  .pending { border-left: 4px solid var(--wait); }
  .what { font-size: 16px; font-weight: 600; word-break: break-word; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; word-break: break-all; }
  .detail { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; margin-top: 4px; padding: 4px 8px; border-radius: 4px; background: rgba(127,127,127,.12); word-break: break-all; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 8px; padding: 8px 18px; cursor: pointer; border: 1px solid transparent; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .approve { background: var(--allow); color: #fff; }
  .deny { background: transparent; color: var(--deny); border-color: var(--deny); }
  button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); padding: 18px 16px; text-align: center; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  td { padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  tr:first-child td { border-top: 0; }
  td.when { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%; }
  td.what { word-break: break-word; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .p-allowed, .p-approved { color: var(--allow); background: var(--allow-bg); }
  .p-BLOCKED, .p-not-approved, .p-error { color: var(--deny); background: var(--deny-bg); }
  .p-timed-out, .p-no-token { color: var(--wait); background: var(--wait-bg); }
  .integrity { margin-top: 10px; font-size: 13px; }
  .ok { color: var(--allow); } .bad { color: var(--deny); font-weight: 600; }
  .banner { background: var(--deny-bg); color: var(--deny); border-radius: 10px; padding: 12px 16px; margin: 16px 0; }
  @media (max-width: 560px) { td.when { white-space: normal; } }
</style>
</head>
<body>
<main>
  <h1>Ovara</h1>
  <p class="sub">Your agent's risky requests wait here for you. This page refreshes on its own.</p>
  <div id="banner" class="banner" hidden></div>

  <h2>Waiting for you</h2>
  <div id="pending"><div class="card empty">Loading…</div></div>

  <h2>Recent activity</h2>
  <div id="activity"></div>
</main>
<script>
(function () {
  // The page token arrives in the URL fragment, which is never sent to
  // any server; keep it for this tab only and clear it from the address bar.
  var m = location.hash.match(/t=([0-9a-fA-F]+)/);
  if (m) { sessionStorage.setItem("ovara-token", m[1]); history.replaceState(null, "", location.pathname); }
  var token = sessionStorage.getItem("ovara-token");
  var banner = document.getElementById("banner");

  function showBanner(text) { banner.textContent = text; banner.hidden = !text; }
  if (!token) { showBanner("No access token. Open the link that `ovara run` printed in your terminal."); return; }

  function api(method, path) {
    return fetch(path, { method: method, headers: { "Authorization": "Bearer " + token } })
      .then(function (r) {
        if (r.status === 401) throw new Error("This link's token was rejected. Open the link `ovara run` printed.");
        if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.statusText); });
        return r.json();
      });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ago(iso) {
    var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    return s < 60 ? s + "s ago" : Math.round(s / 60) + "m ago";
  }

  var busy = {};
  function renderPending(list) {
    var box = document.getElementById("pending");
    box.replaceChildren();
    if (!list.length) { box.appendChild(el("div", "card empty", "Nothing is waiting. Your agent hasn't asked for anything risky.")); return; }
    list.forEach(function (a) {
      var c = el("div", "card pending");
      c.appendChild(el("div", "what", "The agent wants to " + a.what));
      c.appendChild(el("div", "meta", a.raw + "  ·  " + ago(a.created_at) + (a.agent ? "  ·  " + a.agent : "")));
      (a.details || []).forEach(function (d) { c.appendChild(el("div", "detail", d)); });
      var act = el("div", "actions");
      var yes = el("button", "approve", "Approve");
      var no = el("button", "deny", "Deny");
      function setButtons(off) { Array.prototype.forEach.call(act.querySelectorAll("button"), function (b) { b.disabled = off; }); }
      function decide(verb, trust) {
        busy[a.id] = true; setButtons(true);
        api("POST", "/api/" + verb + "/" + encodeURIComponent(a.id) + (trust ? "?trust=1" : ""))
          .then(function () { showBanner(""); refresh(); })
          .catch(function (e) { busy[a.id] = false; setButtons(false); showBanner(e.message); });
      }
      yes.onclick = function () { decide("approve"); };
      no.onclick = function () { decide("deny"); };
      if (busy[a.id]) setButtons(true);
      act.append(yes);
      if (a.trust_host) {
        var always = el("button", "approve", "Approve and trust " + a.trust_host + " for reads");
        always.title = "Adds a read-only (GET/HEAD) rule for this one host to policy.json. Writes still ask.";
        always.onclick = function () { decide("approve", true); };
        act.append(always);
      }
      act.append(no);
      c.appendChild(act);
      box.appendChild(c);
    });
  }

  function renderActivity(act) {
    var box = document.getElementById("activity");
    box.replaceChildren();
    if (!act.entries || !act.entries.length) { box.appendChild(el("div", "card empty", "No activity yet.")); return; }
    var t = el("table");
    act.entries.slice().reverse().forEach(function (e) {
      var tr = el("tr");
      tr.appendChild(el("td", "when", new Date(e.when).toLocaleTimeString()));
      var o = el("td"); o.appendChild(el("span", "pill p-" + e.outcome.replace(/ /g, "-"), e.outcome)); tr.appendChild(o);
      tr.appendChild(el("td", "what", e.what));
      t.appendChild(tr);
    });
    box.appendChild(t);
    var i = el("div", "integrity");
    if (act.checked && act.valid) { i.className += " ok"; i.textContent = "✓ All " + act.total + " receipts are signed and unbroken: this history has not been edited."; }
    else if (act.checked) { i.className += " bad"; i.textContent = "✗ TAMPERED: " + act.problem; }
    else { i.textContent = "Integrity not checked: " + act.problem; }
    box.appendChild(i);
  }

  function refresh() {
    Promise.all([api("GET", "/api/pending"), api("GET", "/api/activity")])
      .then(function (r) { renderPending(r[0]); renderActivity(r[1]); if (banner.textContent.indexOf("reach") >= 0) showBanner(""); })
      .catch(function (e) { showBanner(e.message.indexOf("token") >= 0 ? e.message : "Can't reach Ovara. Is `ovara run` still running?"); });
  }
  refresh();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
